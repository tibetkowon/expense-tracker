<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<style>
body{margin:0;background:#f0eee9;font-family:-apple-system,system-ui,sans-serif}
.dv-turn{padding:40px 44px 32px}
.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}
.dv-tname{font:600 14px/1.2 system-ui,sans-serif;color:#1a1a1a}
.dv-tdesc{font:400 12.5px/1.5 system-ui,sans-serif;color:rgba(0,0,0,.5);margin:0 0 24px;max-width:640px}
.dv-opts{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}
.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}
.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.55)}
.dv-card{border-radius:12px;overflow:hidden}
</style>
</helmet>
<section class="dv-turn" id="t1">
  <div class="dv-thd"><a class="dv-tid" href="#t1">1</a><span class="dv-tname">지출 관리 PWA — 메인 화면</span></div>
  <p class="dv-tdesc">계정/로그아웃, 저장 폴더, 이번 달 요약, 지출 입력 폼, 최근 내역을 한 화면에 담은 모바일 시안. 포인트 컬러는 인디고(#4f46e5) — 토스류의 순수 블루와 구분되면서도 신뢰감 있는 톤. 두 버전 모두 실제로 입력·저장·폴더 선택이 동작함.</p>
  <div class="dv-opts">
    <div class="dv-opt" id="1a">
      <div class="dv-olabel"><a class="dv-oid" href="#1a">1a</a>미니멀 — 흰 배경, 헤어라인 구분, 얇은 CTA</div>
      <div class="dv-card"><dc-import name="ExpenseScreen" variant="minimal" hint-size="402,874"></dc-import></div>
    </div>
    <div class="dv-opt" id="1b">
      <div class="dv-olabel"><a class="dv-oid" href="#1b">1b</a>카드형 — 회색 캔버스, 카드 분리, 색 블록 요약</div>
      <div class="dv-card"><dc-import name="ExpenseScreen" variant="card" hint-size="402,874"></dc-import></div>
    </div>
  </div>
</section>

</x-dc>
</body>
</html>
